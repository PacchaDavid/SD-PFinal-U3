# =============================================================================
# docker-compose.yaml - Plataforma Distribuida de Streaming
# =============================================================================
# Uso: docker compose --profile machine<N> up -d
# Ejemplo: docker compose --profile machine1 up -d
# =============================================================================

# =============================================================================
# Red compartida
# =============================================================================
networks:
  streaming-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/16

# =============================================================================
# Volúmenes compartidos
# =============================================================================
volumes:
  redis-data:
  mariadb-usuarios-primary:
  mariadb-usuarios-replica1:
  mariadb-usuarios-replica2:
  mariadb-usuarios-replica3:
  mariadb-pagos-primary:
  mariadb-pagos-replica1:
  mariadb-pagos-replica2:
  mariadb-pagos-replica3:
  mariadb-recomendaciones-primary:
  mariadb-recomendaciones-replica1:
  mariadb-recomendaciones-replica2:
  mariadb-recomendaciones-replica3:

# =============================================================================
# Servicios
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # MÁQUINA 1: Frontend Web
  # ---------------------------------------------------------------------------
  frontend:
    profiles: ["machine1"]
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: streaming-frontend
    ports:
      - "80:80"
    environment:
      - REACT_APP_API_URL=http://${MACHINE2_IP:-localhost}:8000
      - REACT_APP_WS_URL=ws://${MACHINE2_IP:-localhost}:8082/ws
      - LOAD_BALANCER_HOST=${LOAD_BALANCER_HOST:-${MACHINE2_IP:-load-balancer}}
      - EVENT_MONITOR_HOST=${EVENT_MONITOR_HOST:-${MACHINE2_IP:-event-monitor}}
    networks:
      - streaming-net
    # NOTA: Dependencias cross-profile eliminadas intencionalmente.
    # El frontend se comunica con Machine 2 vía red, no vía Docker Compose.
    # Los reintentos se manejan desde el frontend (axios retry).
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MÁQUINA 2: Infraestructura Central
  # ---------------------------------------------------------------------------
  event-monitor:
    profiles: ["machine2"]
    build:
      context: .
      dockerfile: docker/infrastructure.Dockerfile
      args:
        COMPONENT: event-monitor
        PORT: 8082
    container_name: streaming-event-monitor
    ports:
      - "8082:8082"
    environment:
      - COMPONENT=event-monitor
      - PORT=8082
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - MACHINE_ID=2
      - LOG_LEVEL=INFO
    networks:
      - streaming-net
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  redis:
    profiles: ["machine2"]
    image: redis:7-alpine
    container_name: streaming-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - streaming-net
    command: redis-server --appendonly yes --loglevel notice
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  load-balancer:
    profiles: ["machine2"]
    build:
      context: .
      dockerfile: docker/infrastructure.Dockerfile
      args:
        COMPONENT: load-balancer
        PORT: 8000
    container_name: streaming-load-balancer
    ports:
      - "8000:8000"
    environment:
      - COMPONENT=load-balancer
      - PORT=8000
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - EVENT_MONITOR_URL=${EVENT_MONITOR_URL:-http://event-monitor:8082}
      - MACHINE_ID=2
      - LOG_LEVEL=INFO
    networks:
      - streaming-net
    depends_on:
      - redis
      - event-monitor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # MÁQUINA 3: Microservicio Usuarios
  # ---------------------------------------------------------------------------
  usuarios-service:
    profiles: ["machine3"]
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE_NAME: usuarios
    container_name: streaming-usuarios
    ports:
      - "8081:8080"
    environment:
      - SERVICE_NAME=usuarios
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=docker
      - DB_PRIMARY_HOST=usuarios-db-primary
      - DB_PRIMARY_PORT=3306
      - DB_REPLICA1_HOST=usuarios-db-replica1
      - DB_REPLICA1_PORT=3306
      - DB_REPLICA2_HOST=usuarios-db-replica2
      - DB_REPLICA2_PORT=3306
      - DB_REPLICA3_HOST=usuarios-db-replica3
      - DB_REPLICA3_PORT=3306
      - DB_NAME=streaming_usuarios
      - DB_USER=streaming
      - DB_PASSWORD=streaming_secret_2024
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - EVENT_MONITOR_URL=${EVENT_MONITOR_URL:-http://event-monitor:8082}
      - MACHINE_ID=3
      - REPLICATION_MANAGER_URL=http://usuarios-replication:8090
    networks:
      - streaming-net
    depends_on:
      - usuarios-db-primary
      - usuarios-db-replica1
      - usuarios-db-replica2
      - usuarios-db-replica3
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  usuarios-db-primary:
    profiles: ["machine3"]
    image: mariadb:11.2
    container_name: streaming-usuarios-db-primary
    ports:
      - "3307:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=root_secret_2024
      - MARIADB_DATABASE=streaming_usuarios
      - MARIADB_USER=streaming
      - MARIADB_PASSWORD=streaming_secret_2024
    volumes:
      - mariadb-usuarios-primary:/var/lib/mysql
      - ./configs/mariadb/microservice.cnf:/etc/mysql/conf.d/microservice.cnf
    networks:
      - streaming-net
    command: |
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --log-bin
      --binlog-format=ROW
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

