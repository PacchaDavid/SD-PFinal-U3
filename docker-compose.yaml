      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  pagos-replication:
    profiles: ["machine5"]
    build:
      context: .
      dockerfile: docker/infrastructure.Dockerfile
      args:
        COMPONENT: replication
        PORT: 8090
    container_name: streaming-pagos-replication
    ports:
      - "8092:8090"
    environment:
      - COMPONENT=replication
      - PORT=8090
      - SERVICE_NAME=pagos
      - DB_PRIMARY_HOST=pagos-db-primary
      - DB_PRIMARY_PORT=3306
      - DB_REPLICA1_HOST=pagos-db-replica1
      - DB_REPLICA1_PORT=3306
      - DB_REPLICA2_HOST=pagos-db-replica2
      - DB_REPLICA2_PORT=3306
      - DB_REPLICA3_HOST=pagos-db-replica3
      - DB_REPLICA3_PORT=3306
      - DB_NAME=streaming_pagos
      - DB_USER=streaming
      - DB_PASSWORD=streaming_secret_2024
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - EVENT_MONITOR_URL=${EVENT_MONITOR_URL:-http://event-monitor:8082}
      - MACHINE_ID=5
      - QUORUM_MIN=2
      - POLL_INTERVAL=500
      - REPLICA_TIMEOUT=3000
    networks:
      - streaming-net
    depends_on:
      - pagos-db-primary
      - pagos-db-replica1
      - pagos-db-replica2
      - pagos-db-replica3
    restart: unless-stopped
